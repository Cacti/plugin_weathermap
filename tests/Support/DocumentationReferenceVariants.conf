WIDTH 800
HEIGHT 600
KILO 1000
HTMLSTYLE overlib
SET background_sizing fit
SET traffic_pulse 1
SCALE temperature 0 100 0 255 0
NODE core
 POSITION 200 200
 ICON 50 50 images/objects/cisco-router.png
 LABELOFFSET N20
 USESCALE temperature in absolute
 USEICONSCALE temperature out percent
 MAXVALUE 100
 TARGET static:50:25
NODE remote
 POSITION core 90r100
 LABELOFFSET 90r30
LINK calc
 NODES core remote
 TARGET static:100M:80M -static:20M:10M 0.5*static:40M:20M
 BANDWIDTH 1G
 COMMENTCURVE 0
LINK defaults
 NODES core remote
