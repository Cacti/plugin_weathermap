<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" width="660" height="180" role="img" aria-labelledby="title description"><title id="title">High-load pulse example</title><desc id="description">Illustrated map with 90 percent inbound utilisation and 20 percent outbound. Only the 90 percent arrow pulses. Values are fixed demonstration data.</desc><style>.pulse{opacity:.25;animation:pulse 2.5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.65}}</style><defs><mask id="labels" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" mask-type="luminance" x="-30" y="-30" width="720" height="240"><rect x="-30" y="-30" width="720" height="240" fill="white"/><polygon points="444,81 486,81 486,100 444,100" fill="black" stroke="black" stroke-width="2"/><polygon points="174,81 216,81 216,100 174,100" fill="black" stroke="black" stroke-width="2"/><polygon points="44,82 77,82 77,100 44,100" fill="black" stroke="black" stroke-width="2"/><polygon points="577,82 624,82 624,100 577,100" fill="black" stroke="black" stroke-width="2"/><polygon points="-1,-14 173,-14 173,-1 -1,-1" fill="black" stroke="black" stroke-width="2"/><polygon points="-10000,-10013 -9802,-10013 -9802,-10000 -10000,-10000" fill="black" stroke="black" stroke-width="2"/><polygon points="-10000,-10013 -9802,-10013 -9802,-10000 -10000,-10000" fill="black" stroke="black" stroke-width="2"/><polygon points="10,-27 118,-27 118,-14 10,-14" fill="black" stroke="black" stroke-width="2"/></mask><filter id="glow" filterUnits="userSpaceOnUse" x="-30" y="-30" width="720" height="240" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow-2"/><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glow-5"/><feGaussianBlur in="SourceGraphic" stdDeviation="9" result="glow-9"/><feMerge><feMergeNode in="glow-2"/><feMergeNode in="glow-5"/><feMergeNode in="glow-9"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><image href="data:image/png;base64," width="660" height="180"/><g mask="url(#labels)"><polygon points="600.5,90.5 600.5,102.5 378.5,102.5 378.5,114.5 330.5,90.5 378.5,66.5 378.5,78.5 600.5,78.5 600.5,90.5" fill="none" stroke="#ff0000" stroke-width="2" stroke-linejoin="round" filter="url(#glow)" class="pulse"/></g></svg>
