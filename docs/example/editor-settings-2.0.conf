WIDTH 660
HEIGHT 300
BACKGROUND docs/example/background.png
SET background_sizing fit
SET traffic_pulse 1
KEYPOS -1 -1
TIMEPOS -1 -1
FONTDEFINE 100 docs/example/Vera.ttf 10

NODE core
    LABEL Core router
    ICON 72 72 images/objects/cisco-router.png
    POSITION 120 100
    LABELOFFSET S60
    SET editor_label_position S60

NODE access
    LABEL Access switch
    POSITION 540 100

NODE site_note
    LABEL Example site\nTraffic overview
    LABELFONT 100
    LABELBGCOLOR none
    LABELOUTLINECOLOR none
    LABELFONTSHADOWCOLOR none
    POSITION 330 240
    SET editor_note 1
    SET editor_note_escaped 1
    SET editor_note_align centre

LINK DEFAULT
    COMMENTFONT 100
    COMMENTCURVE 1

LINK uplink
    NODES core access
    TARGET static:900M:200M
    OUTCOMMENT Uplink
    VIA 330 140
