# Global settings belong before the first NODE or LINK.
WIDTH 660
HEIGHT 180
KEYPOS -1 -1
TIMEPOS -1 -1
SET traffic_pulse 1
NODE DEFAULT
    LABELFONT 3
NODE core
    LABEL Core
    POSITION 60 90
NODE access
    LABEL Access
    POSITION 600 90
LINK uplink
    NODES core access
    WIDTH 12
    BANDWIDTH 1G
    TARGET static:900M:200M
    BWLABEL percent
